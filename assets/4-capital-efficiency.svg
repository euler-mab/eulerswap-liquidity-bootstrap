<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1117"/>
      <stop offset="1" stop-color="#070809"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="100" y="100" fill="#FFFFFF" font-size="52" font-weight="700">How little capital this takes</text>
  <text x="100" y="148" fill="#8A93A0" font-size="27">0.95 LTV both ways gives deep leverage &#8212; then v2 lets you concentrate it</text>

  <!-- LEFT: leverage -->
  <rect x="90" y="210" width="680" height="560" rx="18" fill="#11151B" stroke="#243040" stroke-width="2"/>
  <text x="120" y="272" fill="#2EE6A8" font-size="24" font-weight="700" letter-spacing="1">LEVERAGE</text>

  <rect x="120" y="312" width="46" height="46" rx="8" fill="#3A434E"/>
  <text x="184" y="345" fill="#D7DEE6" font-size="28" font-weight="600">1M of stable collateral</text>

  <text x="120" y="430" fill="#8A93A0" font-size="26">can back up to</text>
  <rect x="120" y="452" width="620" height="70" rx="12" fill="#2EE6A8"/>
  <text x="146" y="497" fill="#06241A" font-size="32" font-weight="700">20M borrowing power</text>

  <rect x="120" y="560" width="620" height="64" rx="12" fill="#13241F" stroke="#2EE6A8" stroke-width="2"/>
  <text x="146" y="600" fill="#9FE9CF" font-size="25">1 / (1 &#8722; 0.95) = 20&#215; max, both ways</text>

  <text x="120" y="688" fill="#8A93A0" font-size="23">Run it conservatively: 10M of liquidity from</text>
  <text x="120" y="719" fill="#8A93A0" font-size="23">1M still leaves a wide health buffer.</text>

  <!-- RIGHT: concentration -->
  <rect x="830" y="210" width="680" height="560" rx="18" fill="#11151B" stroke="#243040" stroke-width="2"/>
  <text x="860" y="272" fill="#A78BFA" font-size="24" font-weight="700" letter-spacing="1">CONCENTRATE IT &#183; v2</text>

  <!-- chart -->
  <line x1="880" y1="620" x2="1480" y2="620" stroke="#2A323C" stroke-width="2"/>
  <!-- uniform -->
  <rect x="880" y="600" width="600" height="16" fill="#3A434E"/>
  <!-- concentrated curve -->
  <path d="M930,620 C1110,620 1160,400 1180,400 C1200,400 1250,620 1430,620 Z" fill="#2EE6A8" fill-opacity="0.22" stroke="#2EE6A8" stroke-width="3"/>
  <line x1="1180" y1="400" x2="1180" y2="620" stroke="#2EE6A8" stroke-width="1.5" stroke-dasharray="4 6"/>

  <g fill="#5A636E" font-size="22">
    <text x="880" y="660">$0.99</text>
    <text x="1180" y="660" text-anchor="middle">$1.00</text>
    <text x="1480" y="660" text-anchor="end">$1.01</text>
  </g>

  <!-- legend -->
  <rect x="880" y="690" width="22" height="22" rx="4" fill="#2EE6A8"/>
  <text x="912" y="708" fill="#C7CDD4" font-size="23">concentrated (v2)</text>
  <rect x="1180" y="690" width="22" height="22" rx="4" fill="#3A434E"/>
  <text x="1212" y="708" fill="#8A93A0" font-size="23">uniform AMM</text>

  <text x="880" y="752" fill="#8A93A0" font-size="23">Same inventory, far more usable depth where trades cluster.</text>
</svg>
