<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1117"/>
      <stop offset="1" stop-color="#070809"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="100" y="120" fill="#FFFFFF" font-size="56" font-weight="700">The cost of deep stablecoin liquidity</text>
  <text x="100" y="172" fill="#8A93A0" font-size="28">Annual cost to keep ~$10M of RLUSD &#8644; USDC liquidity live</text>

  <!-- gridlines: scale 54.5 px per %, x0 = 100 -->
  <g stroke="#1E242C" stroke-width="2">
    <line x1="372" y1="250" x2="372" y2="770"/>
    <line x1="645" y1="250" x2="645" y2="770"/>
    <line x1="917" y1="250" x2="917" y2="770"/>
    <line x1="1190" y1="250" x2="1190" y2="770"/>
  </g>
  <g fill="#5A636E" font-size="22">
    <text x="372" y="240" text-anchor="middle">5%</text>
    <text x="645" y="240" text-anchor="middle">10%</text>
    <text x="917" y="240" text-anchor="middle">15%</text>
    <text x="1190" y="240" text-anchor="middle">20%</text>
  </g>

  <!-- Market maker: 10-20% -->
  <text x="100" y="305" fill="#C7CDD4" font-size="28" font-weight="600">Private market maker</text>
  <rect x="100" y="320" width="545" height="84" rx="10" fill="#FF6B6B"/>
  <rect x="645" y="320" width="546" height="84" rx="10" fill="#FF6B6B" opacity="0.32"/>
  <text x="1215" y="373" fill="#FF8A8A" font-size="34" font-weight="700">10&#8211;20% / yr</text>

  <!-- Euler gross 3-4% -->
  <text x="100" y="475" fill="#C7CDD4" font-size="28" font-weight="600">EulerSwap &#8212; gross borrow cost</text>
  <rect x="100" y="490" width="164" height="84" rx="10" fill="#F5B544"/>
  <rect x="264" y="490" width="55" height="84" rx="10" fill="#F5B544" opacity="0.32"/>
  <text x="334" y="543" fill="#F5C76E" font-size="34" font-weight="700">3&#8211;4% / yr</text>

  <!-- Euler net 1-2% -->
  <text x="100" y="645" fill="#C7CDD4" font-size="28" font-weight="600">EulerSwap &#8212; net of swap fees</text>
  <rect x="100" y="660" width="55" height="84" rx="10" fill="#2EE6A8"/>
  <rect x="155" y="660" width="55" height="84" rx="10" fill="#2EE6A8" opacity="0.32"/>
  <text x="225" y="713" fill="#5FF0C2" font-size="34" font-weight="700">1&#8211;2% / yr</text>

  <text x="100" y="835" fill="#6B7480" font-size="24">Cost of liquidity = the borrow rate on USDC. Swap fees you earn offset most of it.</text>
</svg>
